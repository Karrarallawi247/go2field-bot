name: Go2Field Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run monitor script
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID_SABAH: ${{ secrets.TG_CHAT_ID_SABAH }}
          TG_CHAT_ID_FOC: ${{ secrets.TG_CHAT_ID_FOC }}
          G2F_REFRESH_TOKEN: ${{ secrets.G2F_REFRESH_TOKEN }}
        run: python monitor.py

      - name: Save seen_tasks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_tasks.json
          if git diff --staged --quiet; then
            echo "No changes to seen_tasks.json"
          else
            git commit -m "Update seen_tasks.json [skip ci]"
            git push
          fi
