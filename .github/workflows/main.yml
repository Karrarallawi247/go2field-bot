- name: Save seen_tasks.json
     run: |
       git config user.name "github-actions[bot]"
       git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

       python - << 'EOF'
       import json, subprocess

       with open("seen_tasks.json", "r", encoding="utf-8") as f:
           local_state = json.load(f)

       try:
           remote_raw = subprocess.check_output(
               ["git", "show", "origin/main:seen_tasks.json"],
               stderr=subprocess.DEVNULL,
               text=True,
           )
           remote_state = json.loads(remote_raw)
       except Exception:
           remote_state = {}

       merged = {**remote_state, **local_state}
       with open("seen_tasks.json", "w", encoding="utf-8") as f:
           json.dump(merged, f, ensure_ascii=False, indent=2)
       EOF

       git add seen_tasks.json
       if git diff --staged --quiet; then
         echo "No changes to seen_tasks.json"
       else
         git commit -m "Update seen_tasks.json [skip ci]"
         for i in 1 2 3; do
           git fetch origin main
           git rebase origin/main && git push && break
           git rebase --abort || true
           python - << 'EOF'
       import json, subprocess
       with open("seen_tasks.json", "r", encoding="utf-8") as f:
           local_state = json.load(f)
       remote_raw = subprocess.check_output(["git", "show", "origin/main:seen_tasks.json"], text=True)
       remote_state = json.loads(remote_raw)
       with open("seen_tasks.json", "w", encoding="utf-8") as f:
           json.dump({**remote_state, **local_state}, f, ensure_ascii=False, indent=2)
       EOF
           git add seen_tasks.json
           git commit --amend --no-edit
         done
       fi
